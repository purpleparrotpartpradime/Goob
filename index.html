<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Infinite Loop</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#player {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
}
</style>
</head>
<body>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

const VIDEO_ID = "AVWX6dPEeOY";

let player = null;
let monitor = null;
let rebuilding = false;

function onYouTubeIframeAPIReady() {
    createPlayer();
}

function createPlayer() {

    rebuilding = false;

    player = new YT.Player("player", {

        host: "https://www.youtube-nocookie.com",

        videoId: VIDEO_ID,

        playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            fs: 1,
            playsinline: 1,
            rel: 0,
            modestbranding: 1,
            iv_load_policy: 3,
            loop: 1,
            playlist: VIDEO_ID,
            origin: location.origin
        },

        events: {
            onReady: onReady,
            onStateChange: onStateChange,
            onError: onError
        }

    });

}

function onReady() {

    play();

    clearInterval(monitor);

    monitor = setInterval(() => {

        try {

            if (!player) {
                rebuild();
                return;
            }

            const state = player.getPlayerState();

            if (
                state !== YT.PlayerState.PLAYING &&
                state !== YT.PlayerState.BUFFERING
            ) {
                play();
            }

        } catch (e) {
            rebuild();
        }

    }, 3000);

}

function play() {

    try {

        player.playVideo();

    } catch (e) {
        rebuild();
    }

}

function onStateChange(event) {

    if (event.data === YT.PlayerState.ENDED) {

        try {

            player.seekTo(0, true);
            player.playVideo();

        } catch (e) {
            rebuild();
        }

    }

}

function onError(event) {

    console.log("YouTube Error:", event.data);

    rebuild();

}

function rebuild() {

    if (rebuilding) {
        return;
    }

    rebuilding = true;

    clearInterval(monitor);

    try {

        if (player && typeof player.destroy === "function") {
            player.destroy();
        }

    } catch (e) {}

    setTimeout(() => {

        document.getElementById("player").innerHTML = "";

        createPlayer();

    }, 2500);

}

window.addEventListener("online", rebuild);

window.addEventListener("focus", play);

document.addEventListener("visibilitychange", () => {

    if (!document.hidden) {
        play();
    }

});

</script>

</body>
</html>
