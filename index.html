<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep Ambient Player</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* video layer */
#player {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
}

/* ambient background overlay */
#ambient {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0,80,120,0.25), transparent 60%);
    animation: drift 20s ease-in-out infinite;
    z-index: 1;
    pointer-events: none;
}

@keyframes drift {
    0% { transform: scale(1) translate(0,0); filter: blur(0px); }
    50% { transform: scale(1.05) translate(10px,-10px); filter: blur(2px); }
    100% { transform: scale(1) translate(0,0); filter: blur(0px); }
}

/* UI layer */
#ui {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    color: white;
}

/* bottom panel */
#panel {
    position: absolute;
    left: 16px;
    bottom: 16px;
    background: rgba(0,0,0,0.4);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    backdrop-filter: blur(8px);
    transition: opacity 0.8s ease;
}

/* top status */
#status {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 12px;
    opacity: 0.8;
}

/* hidden UI mode */
.hidden {
    opacity: 0;
}

/* subtle pulse */
#pulse {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.2);
    z-index: 2;
    animation: pulse 8s infinite;
    pointer-events: none;
}

@keyframes pulse {
    0% { opacity: 0.15; }
    50% { opacity: 0.05; }
    100% { opacity: 0.15; }
}

</style>
</head>

<body>

<div id="player"></div>

<div id="ambient"></div>
<div id="pulse"></div>

<div id="ui">
    <div id="status">Initializing...</div>
    <div id="panel">
        Sleep Mode Active<br>
        Tap to show UI
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

const VIDEO_ID = "AVWX6dPEeOY";

let player = null;
let monitor = null;
let rebuilding = false;

const ui = document.getElementById("ui");
const statusEl = document.getElementById("status");

let uiTimeout = null;

function setStatus(t){
    statusEl.textContent = t;
}

function hideUI(){
    ui.classList.add("hidden");
}

function showUI(){
    ui.classList.remove("hidden");
    clearTimeout(uiTimeout);
    uiTimeout = setTimeout(hideUI, 4000);
}

document.addEventListener("click", showUI);

function onYouTubeIframeAPIReady() {
    createPlayer();
}

function createPlayer() {

    rebuilding = false;

    player = new YT.Player("player", {

        host: "https://www.youtube-nocookie.com",

        videoId: VIDEO_ID,

        playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            playsinline: 1,
            rel: 0,
            modestbranding: 1,
            iv_load_policy: 3,
            loop: 1,
            playlist: VIDEO_ID,
            origin: location.origin
        },

        events: {
            onReady: onReady,
            onStateChange: onStateChange,
            onError: onError
        }

    });

}

function onReady() {

    setStatus("Playing");

    play();

    clearInterval(monitor);

    monitor = setInterval(() => {

        try {

            if (!player) {
                rebuild();
                return;
            }

            const state = player.getPlayerState();

            if (
                state !== YT.PlayerState.PLAYING &&
                state !== YT.PlayerState.BUFFERING
            ) {
                play();
            }

        } catch (e) {
            rebuild();
        }

    }, 3000);

}

function play() {

    try {
        player.playVideo();
    } catch (e) {
        rebuild();
    }

}

function onStateChange(event) {

    if (event.data === YT.PlayerState.ENDED) {

        try {
            player.seekTo(0, true);
            player.playVideo();
        } catch (e) {
            rebuild();
        }

    }

}

function onError(event) {

    setStatus("Error: " + event.data);

    rebuild();

}

function rebuild() {

    if (rebuilding) return;

    rebuilding = true;

    clearInterval(monitor);

    setStatus("Recovering...");

    try {
        if (player) player.destroy();
    } catch (e) {}

    setTimeout(() => {
        document.getElementById("player").innerHTML = "";
        createPlayer();
    }, 2000);

}

window.addEventListener("online", rebuild);

window.addEventListener("focus", play);

document.addEventListener("visibilitychange", () => {
    if (!document.hidden) play();
});

</script>

</body>
</html>
